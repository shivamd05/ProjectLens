spring.config.import=optional:file:../backend/.env[.properties],optional:file:.env[.properties]
server.port=8000

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/projectlens?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

projectlense.upload-dir=../backend/uploads
projectlense.extract-dir=../backend/extracted_projects
projectlense.legacy-db-file=../backend/projects_db.json

projectlense.admin-token=${PROJECTLENSE_ADMIN_TOKEN:}
projectlense.embedding.api-key=${OPENAI_API_KEY:}
projectlense.embedding.model=text-embedding-3-small
projectlense.evaluation.gemini-model=${GEMINI_MODEL:gemini-3.8-flash}
projectlense.similarity.threshold=0.78
projectlense.similarity.limit=5

spring.jackson.serialization.write-dates-as-timestamps=false
